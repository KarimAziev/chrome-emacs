<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Emacs E2E: Plain Fields</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px 72px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 28px;
      }

      h2 {
        margin: 28px 0 10px;
        font-size: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }

      label,
      .field {
        display: grid;
        gap: 6px;
      }

      textarea,
      input,
      [contenteditable='true'] {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas);
        border-radius: 6px;
        padding: 10px 12px;
        background: Canvas;
        color: CanvasText;
        font:
          14px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      [contenteditable='true'] {
        min-height: 120px;
      }

      .status {
        margin-top: 24px;
        padding: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas);
        border-radius: 6px;
        font-size: 13px;
      }

      .hidden-target {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chrome Emacs Plain Field Fixture</h1>

      <section class="grid" aria-label="editable plain fields">
        <label>
          Textarea
          <textarea id="main-textarea" data-testid="main-textarea">
First textarea line
Second textarea line
          </textarea>
        </label>

        <div class="field">
          <span>Contenteditable</span>
          <div
            id="main-contenteditable"
            data-testid="main-contenteditable"
            contenteditable="true"
          >
            <p>
              Editable
              <strong>HTML</strong>
              block
            </p>
            <p>Second paragraph</p>
          </div>
        </div>

        <label>
          Text input
          <input
            id="main-input"
            data-testid="main-input"
            value="Visible input value"
          />
        </label>

        <label>
          Number input
          <input
            id="number-input"
            data-testid="number-input"
            type="number"
            value="42"
          />
        </label>
      </section>

      <section aria-label="negative fields">
        <h2>Negative Cases</h2>
        <div class="grid">
          <label>
            Readonly textarea
            <textarea id="readonly-textarea" readonly>Do not edit me</textarea>
          </label>
          <label>
            Disabled textarea
            <textarea id="disabled-textarea" disabled>Disabled text</textarea>
          </label>
          <label>
            Hidden input
            <input id="hidden-input" class="hidden-target" value="Hidden" />
          </label>
        </div>
      </section>

      <div id="event-log" class="status" data-testid="event-log">
        Waiting for field events.
      </div>
    </main>

    <script>
      const log = document.querySelector('#event-log');
      const targets = [
        '#main-textarea',
        '#main-contenteditable',
        '#main-input',
        '#number-input',
      ];

      for (const selector of targets) {
        const target = document.querySelector(selector);
        target.addEventListener('input', () => {
          log.textContent = `${selector} input event`;
        });
        target.addEventListener('change', () => {
          log.textContent = `${selector} change event`;
        });
      }
    </script>
  </body>
</html>
