<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Emacs E2E: Scenarios</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }

      h1 {
        margin: 0 0 22px;
        font-size: 28px;
      }

      section {
        margin-top: 28px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      textarea,
      iframe,
      .mount {
        box-sizing: border-box;
        width: 100%;
        min-height: 140px;
        border: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
        border-radius: 6px;
      }

      textarea {
        padding: 10px 12px;
        background: Canvas;
        color: CanvasText;
        font:
          14px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      button {
        min-height: 34px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas);
        border-radius: 6px;
        padding: 0 12px;
        background: ButtonFace;
        color: ButtonText;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }

      .offscreen {
        margin-top: 100vh;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chrome Emacs Scenario Fixture</h1>

      <section>
        <h2>Dynamic Element</h2>
        <div class="controls">
          <button id="add-dynamic" type="button">Add textarea</button>
          <button id="remove-dynamic" type="button">Remove textarea</button>
        </div>
        <div id="dynamic-mount" class="mount"></div>
      </section>

      <section>
        <h2>Shadow DOM</h2>
        <div id="shadow-host" class="mount"></div>
      </section>

      <section>
        <h2>Same-Origin Iframe</h2>
        <iframe
          id="same-origin-frame"
          title="same-origin editor frame"
          srcdoc="<textarea id='frame-textarea'>Frame textarea value</textarea>"
        ></iframe>
      </section>

      <section class="offscreen">
        <h2>Initially Offscreen</h2>
        <textarea id="offscreen-textarea">Offscreen textarea value</textarea>
      </section>
    </main>

    <script>
      const mount = document.querySelector('#dynamic-mount');
      const addDynamic = () => {
        mount.innerHTML = '';
        const textarea = document.createElement('textarea');
        textarea.id = 'dynamic-textarea';
        textarea.value = 'Dynamic textarea value';
        mount.append(textarea);
        textarea.focus();
      };

      document
        .querySelector('#add-dynamic')
        .addEventListener('click', addDynamic);
      document
        .querySelector('#remove-dynamic')
        .addEventListener('click', () => {
          mount.innerHTML = '';
        });

      const shadowRoot = document
        .querySelector('#shadow-host')
        .attachShadow({ mode: 'open' });
      shadowRoot.innerHTML = `
        <style>
          textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 120px;
            padding: 10px 12px;
            font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          }
        </style>
        <textarea id="shadow-textarea">Shadow textarea value</textarea>
      `;
    </script>
  </body>
</html>
